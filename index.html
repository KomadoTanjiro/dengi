<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2F4F7;--ink:#1C2836;--muted:#6A7585;--line:#DDE2E9;--cobalt:#2B54D9;--soft:#E3E9FB;--ok:#2C8A5A;--warn:#B5651D;--over:#C4372C;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 70px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

  .month{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .month h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;text-transform:capitalize}
  .nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}

  .tabs{display:flex;gap:4px;background:#E3E7ED;border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:none;background:none;padding:9px 0;border-radius:9px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(28,40,54,.12)}

  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .sum div{font-size:12px;color:var(--muted)}
  .sum b{display:block;font-size:17px;color:var(--ink);font-weight:700}
  .sum .live b{color:var(--cobalt)}

  .warn{background:#FBEFE3;color:#7A4312;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
  .warn p{margin:2px 0}

  .day{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .day h2{font-size:18px;margin:0;font-weight:800}
  .day .in{font-size:14px;color:var(--muted);margin:2px 0 8px}
  .day .in b{color:var(--ok);font-weight:700}
  .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .item input[type=checkbox]{width:22px;height:22px;accent-color:var(--cobalt);flex:0 0 auto;margin:0}
  .item .nm{flex:1;min-width:0}
  .item .nm small{display:block;color:var(--muted);font-size:12px}
  .item .v{font-weight:700;white-space:nowrap}
  .item.done .nm,.item.done .v{color:var(--muted);text-decoration:line-through}
  .item.keep .v{color:var(--warn)}
  .live-line{margin-top:6px;background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .live-line span{font-size:14px}
  .live-line b{font-size:18px;color:var(--cobalt);white-space:nowrap}
  .live-line small{display:block;color:var(--muted);font-size:12px}

  .sec{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .sec h3{margin:0 0 4px;font-size:17px}
  .sec .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
  label.f input,label.f select{margin-top:3px}
  input,select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;min-width:0;font-size:16px}
  input[type=date]{min-height:42px;-webkit-appearance:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .entry{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .entry .top{display:flex;gap:8px;align-items:flex-start}
  .entry .top label{flex:1}
  .del{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:22px 4px 0}
  .ghost{border:1px dashed #C6CDD7;background:none;border-radius:10px;padding:10px;width:100%;color:var(--muted);margin-top:4px}
  .status{font-size:12px;color:var(--muted);text-align:center;min-height:16px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="month">
    <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
    <h1 id="title">…</h1>
    <button class="nav" id="next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="tabs">
    <button data-tab="plan" class="on">План</button>
    <button data-tab="edit">Данные месяца</button>
  </div>
  <div id="view"></div>
  <div class="status" id="status"></div>
</div>

<script>
const pad = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2,9);
const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0)) + ' ₽';
const r1k = x => Math.round(x/1000)*1000;
const D = iso => new Date(iso+'T00:00:00');
const days = (a,b) => Math.round((D(b)-D(a))/864e5);
const longDate = iso => D(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const shortDate = iso => D(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => parseFloat(String(v).replace(',','.').replace(/\s/g,''))||0;
function addMonth(iso){
  if(!iso) return iso;
  let [y,m,d] = iso.split('-').map(Number); m++; if(m>12){m=1;y++;}
  return `${y}-${pad(m)}-${pad(Math.min(d,new Date(y,m,0).getDate()))}`;
}

const SEEDS = {};

let ym = (()=>{ const t=new Date(); return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; })();
let S = null, tab = 'plan';
const keyOf = k => 'moneyplan:'+k;
const shiftYm = (k,n) => { let [y,m]=k.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${pad(m)}`; };
const setStatus = t => document.getElementById('status').textContent = t;

async function getPlan(k){
  try{ const v = localStorage.getItem(keyOf(k)); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
async function load(){
  setStatus('Загрузка…');
  let p = await getPlan(ym);
  if(!p && SEEDS[ym]) p = JSON.parse(JSON.stringify(SEEDS[ym]));
  if(!p){
    const prevK = shiftYm(ym,-1);
    let prev = await getPlan(prevK) || (SEEDS[prevK] ? JSON.parse(JSON.stringify(SEEDS[prevK])) : null);
    if(prev){
      p = JSON.parse(JSON.stringify(prev));
      p.paydays.forEach(d=>d.date=addMonth(d.date));
      p.payments.forEach(x=>x.deadline=addMonth(x.deadline));
      p.endDate = addMonth(p.endDate); p.extra = 0; p.checks = {};
    } else {
      const s = `${ym}-15`;
      p = {paydays:[{id:uid(),label:'Аванс',date:s,amount:0}], endDate:addMonth(s), extra:0, payments:[], card:{target:0,min:0,minPayday:'none'}, savings:0, checks:{}};
    }
  }
  S = p; setStatus(''); render();
}
let tmr;
function save(){
  clearTimeout(tmr);
  tmr = setTimeout(async()=>{
    try{ localStorage.setItem(keyOf(ym), JSON.stringify(S)); setStatus('Сохранено'); }
    catch(e){ setStatus('Не удалось сохранить'); }
  },400);
}

/* ---------- расчёт ---------- */
function compute(){
  const warns = [];
  const pd = S.paydays.filter(d=>d.date).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!pd.length) return {pd:[],warns:['Добавьте хотя бы один приход денег.']};
  const n = pd.length;
  const P = pd.map(d=>({...d, pays:[], card:0, sav:0, live:0, keep:0, bonus:0}));

  S.payments.forEach(x=>{
    if(!num(x.amount)) return;
    let idx = -1;
    if(x.payday && x.payday!=='auto') idx = P.findIndex(d=>d.id===x.payday);
    if(idx<0 && x.deadline){
      for(let i=0;i<n;i++) if(P[i].date<=x.deadline) idx=i;
      if(idx<0){ idx=0; warns.push(`«${x.name}» нужно оплатить до ${shortDate(x.deadline)}, а первые деньги придут только ${shortDate(P[0].date)}.`); }
    }
    if(idx<0) idx=0;
    if(x.deadline && P[idx].date > x.deadline) warns.push(`«${x.name}»: выбранный приход позже срока ${shortDate(x.deadline)}.`);
    P[idx].pays.push(x);
  });

  P.forEach((d,i)=>{
    const to = i<n-1 ? P[i+1].date : S.endDate;
    d.to = to; d.days = to ? days(d.date,to) : 0;
    if(d.days<=0){ d.days = 1; if(i===n-1) warns.push('Дата «План до» должна быть позже последнего прихода.'); }
    d.payTotal = d.pays.reduce((s,x)=>s+num(x.amount),0);
  });

  const income = P.reduce((s,d)=>s+num(d.amount),0) + num(S.extra);
  const pay = P.reduce((s,d)=>s+d.payTotal,0);
  const cardT = num(S.card.target), savT = num(S.savings);
  let liveTotal = income - pay - cardT - savT;
  if(liveTotal<0){ warns.push(`Не хватает ${fmt(-liveTotal)}: уменьшите сумму на кредитку или «отложить».`); liveTotal = 0; }

  const totDays = P.reduce((s,d)=>s+d.days,0);
  let acc = 0;
  P.forEach((d,i)=>{ d.live = i<n-1 ? r1k(liveTotal*d.days/totDays) : liveTotal-acc; acc += d.live; });

  // свободные деньги по приходам; если не хватает — оставляем с прошлого прихода
  const free = P.map((d,i)=> num(d.amount) + (i===0?num(S.extra):0) - d.payTotal - d.live);
  for(let i=n-1;i>0;i--){ if(free[i]<0){ free[i-1]+=free[i]; P[i-1].keep = -free[i]; free[i]=0; } }
  if(free[0]<0){ warns.push(`Платежи и жизнь в начале месяца не покрываются: не хватает ${fmt(-free[0])}.`); P[0].live = Math.max(0,P[0].live+free[0]); free[0]=0; }

  let remC = cardT, remS = savT, cardSoFar = 0;
  const minIdx = P.findIndex(d=>d.id===S.card.minPayday);
  P.forEach((d,i)=>{
    const f = free[i];
    let need = (i===minIdx) ? Math.max(0, num(S.card.min)-cardSoFar) : 0;
    need = Math.min(need, f, remC);
    let c, s;
    if(i===n-1){ c = Math.min(remC,f); s = Math.min(remS, f-c); }
    else{
      const rest = f-need, cl = remC-need, tot = cl+remS;
      c = need + (tot>0 ? r1k(rest*cl/tot) : 0);
      c = Math.max(need, Math.min(c, remC, f));
      s = Math.min(remS, f-c);
    }
    d.card=c; d.sav=s; d.bonus = f-c-s; d.live += d.bonus;
    remC-=c; remS-=s; cardSoFar+=c;
  });
  if(minIdx>=0 && num(S.card.min) && P.slice(0,minIdx+1).reduce((s,d)=>s+d.card,0) < num(S.card.min))
    warns.push(`К ${shortDate(P[minIdx].date)} не получается внести обязательный платёж по кредитке целиком.`);
  if(remC>0.5) warns.push(`На кредитку не хватает ${fmt(remC)}.`);
  if(remS>0.5) warns.push(`Отложить получается на ${fmt(remS)} меньше цели.`);

  const live = P.reduce((s,d)=>s+d.live,0);
  return {pd:P, warns, income, pay, cardT, savT, live, perDay: live/totDays};
}

/* ---------- экран плана ---------- */
function renderPlan(){
  const R = compute(), V = document.getElementById('view');
  if(!R.pd.length){ V.innerHTML = `<div class="empty">Заполните вкладку «Данные месяца».</div>`; return; }
  const chk = k => S.checks[k] ? 'checked' : '';
  const item = (k,name,sub,v) => `<label class="item ${S.checks[k]?'done':''}"><input type="checkbox" data-k="${k}" ${chk(k)}>
      <span class="nm">${esc(name)}${sub?`<small>${sub}</small>`:''}</span><span class="v">${fmt(v)}</span></label>`;
  V.innerHTML = `
    <div class="sum">
      <div>Приход<b>${fmt(R.income)}</b></div>
      <div>Платежи<b>${fmt(R.pay)}</b></div>
      <div>Кредитка<b>${fmt(R.cardT)}</b></div>
      <div>Отложить<b>${fmt(R.savT)}</b></div>
      <div class="live">На жизнь<b>${fmt(R.live)}</b></div>
      <div class="live">В день<b>≈ ${fmt(Math.round(R.perDay/100)*100)}</b></div>
    </div>
    ${R.warns.length?`<div class="warn">${R.warns.map(w=>`<p>${esc(w)}</p>`).join('')}</div>`:''}
    ${R.pd.map((d,i)=>`
      <div class="day">
        <h2>${longDate(d.date)}</h2>
        <div class="in">${esc(d.label||'Приход')}: <b>+${fmt(d.amount)}</b>${i===0&&num(S.extra)?`, плюс на руках ${fmt(S.extra)}`:''}</div>
        ${d.pays.map(x=>item('p:'+x.id, x.name, x.deadline?`до ${shortDate(x.deadline)}`:'', x.amount)).join('')}
        ${d.card?item('c:'+d.id,'На кредитку', (S.card.minPayday===d.id&&num(S.card.min))?`включая обязательный платёж ${fmt(S.card.min)}`:'', d.card):''}
        ${d.sav?item('s:'+d.id,'Отложить','на отдельный счёт',d.sav):''}
        ${d.keep?`<div class="item keep"><span class="nm">Не трогать, оставить<small>понадобится после ${shortDate(d.to)}</small></span><span class="v">${fmt(d.keep)}</span></div>`:''}
        <div class="live-line"><span>На жизнь до ${shortDate(d.to)}<small>${d.days} дн., ≈ ${fmt(Math.round(d.live/d.days/100)*100)} в день</small></span><b>${fmt(d.live)}</b></div>
      </div>`).join('')}`;
  V.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{
    if(c.checked) S.checks[c.dataset.k]=true; else delete S.checks[c.dataset.k];
    c.closest('.item').classList.toggle('done',c.checked); save();
  });
}

/* ---------- экран данных ---------- */
function renderEdit(){
  const V = document.getElementById('view');
  const pdSorted = S.paydays.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const pdOpts = (sel,first) => first + pdSorted.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${d.date?shortDate(d.date):'?'} ${esc(d.label)}</option>`).join('');
  V.innerHTML = `
    <div class="sec">
      <h3>Приходы денег</h3>
      <p class="hint">Пишите сумму, которая реально придёт на карту.</p>
      ${S.paydays.map(d=>`<div class="entry"><div class="top">
          <label class="f">Название<input data-pd="${d.id}" data-f="label" value="${esc(d.label)}"></label>
          <button class="del" data-delpd="${d.id}" aria-label="Удалить приход">×</button></div>
        <div class="grid2"><label class="f">Дата<input type="date" data-pd="${d.id}" data-f="date" value="${d.date||''}"></label>
          <label class="f">Сумма<input inputmode="decimal" data-pd="${d.id}" data-f="amount" value="${d.amount||''}" placeholder="0"></label></div></div>`).join('')}
      <button class="ghost" id="addPd">+ Добавить приход</button>
      <div class="grid2" style="margin-top:12px">
        <label class="f">Уже есть на руках<input inputmode="decimal" id="extra" value="${S.extra||''}" placeholder="0"></label>
        <label class="f">План до (след. аванс)<input type="date" id="endDate" value="${S.endDate||''}"></label>
      </div>
    </div>

    <div class="sec">
      <h3>Обязательные платежи</h3>
      <p class="hint">Укажите срок — план сам поставит платёж на последний приход перед ним. Или выберите приход вручную.</p>
      ${S.payments.map(x=>`<div class="entry"><div class="top">
          <label class="f">Что<input data-py="${x.id}" data-f="name" value="${esc(x.name)}"></label>
          <button class="del" data-delpy="${x.id}" aria-label="Удалить платёж">×</button></div>
        <div class="grid2"><label class="f">Сумма<input inputmode="decimal" data-py="${x.id}" data-f="amount" value="${x.amount||''}" placeholder="0"></label>
          <label class="f">Оплатить до<input type="date" data-py="${x.id}" data-f="deadline" value="${x.deadline||''}"></label></div>
        <label class="f">С какого прихода<select data-py="${x.id}" data-f="payday">${pdOpts(x.payday,`<option value="auto" ${x.payday==='auto'?'selected':''}>Автоматически</option>`)}</select></label></div>`).join('')}
      <button class="ghost" id="addPy">+ Добавить платёж</button>
    </div>

    <div class="sec">
      <h3>Кредитка</h3>
      <p class="hint">Общая сумма, которую нужно внести за месяц. Обязательный платёж входит в неё.</p>
      <div class="grid2"><label class="f">Внести всего<input inputmode="decimal" id="cardT" value="${S.card.target||''}" placeholder="0"></label>
        <label class="f">Обязательный платёж<input inputmode="decimal" id="cardM" value="${S.card.min||''}" placeholder="0"></label></div>
      <label class="f">Обязательный внести не позже прихода<select id="cardP">${pdOpts(S.card.minPayday,`<option value="none" ${S.card.minPayday==='none'?'selected':''}>Не важно</option>`)}</select></label>
    </div>

    <div class="sec">
      <h3>Отложить</h3>
      <label class="f">Сколько отложить за месяц<input inputmode="decimal" id="sav" value="${S.savings||''}" placeholder="0"></label>
    </div>
    <button class="ghost" id="resetChecks">Снять все галочки в этом месяце</button>

    <div class="sec" style="margin-top:12px">
      <h3>Резервная копия</h3>
      <p class="hint">Данные хранятся только на этом телефоне. Время от времени копируйте их в Заметки, чтобы не потерять.</p>
      <button class="primary" id="exportB">Скопировать все данные</button>
      <textarea id="backup" rows="4" placeholder="Вставьте сюда резервную копию" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit"></textarea>
      <button class="ghost" id="importB">Восстановить из копии</button>
    </div>`;

  const isNum = f => ['amount'].includes(f);
  V.querySelectorAll('[data-pd]').forEach(i=>i.oninput=i.onchange=()=>{
    const d = S.paydays.find(x=>x.id===i.dataset.pd); d[i.dataset.f] = isNum(i.dataset.f)?num(i.value):i.value; save();
  });
  V.querySelectorAll('[data-py]').forEach(i=>i.oninput=i.onchange=()=>{
    const x = S.payments.find(y=>y.id===i.dataset.py); x[i.dataset.f] = isNum(i.dataset.f)?num(i.value):i.value; save();
  });
  V.querySelectorAll('[data-delpd]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delpd; S.paydays=S.paydays.filter(d=>d.id!==id);
    S.payments.forEach(x=>{ if(x.payday===id) x.payday='auto'; }); if(S.card.minPayday===id) S.card.minPayday='none';
    save(); renderEdit();
  });
  V.querySelectorAll('[data-delpy]').forEach(b=>b.onclick=()=>{ S.payments=S.payments.filter(x=>x.id!==b.dataset.delpy); save(); renderEdit(); });
  addPd.onclick=()=>{ const last=pdSorted[pdSorted.length-1]; S.paydays.push({id:uid(),label:'Приход',date:last?.date||'',amount:0}); save(); renderEdit(); };
  addPy.onclick=()=>{ S.payments.push({id:uid(),name:'Новый платёж',amount:0,deadline:'',payday:'auto'}); save(); renderEdit();
    const ins=V.querySelectorAll('[data-f="name"]'); ins[ins.length-1].select(); };
  extra.oninput=()=>{S.extra=num(extra.value);save();};
  endDate.onchange=()=>{S.endDate=endDate.value;save();};
  cardT.oninput=()=>{S.card.target=num(cardT.value);save();};
  cardM.oninput=()=>{S.card.min=num(cardM.value);save();};
  cardP.onchange=()=>{S.card.minPayday=cardP.value;save();};
  sav.oninput=()=>{S.savings=num(sav.value);save();};
  resetChecks.onclick=()=>{ S.checks={}; save(); setStatus('Галочки сняты'); };
  exportB.onclick=async()=>{
    const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('moneyplan:')) o[k]=JSON.parse(localStorage.getItem(k)); }
    const t=JSON.stringify(o);
    try{ await navigator.clipboard.writeText(t); setStatus('Скопировано, вставьте в Заметки'); }
    catch(e){ backup.value=t; backup.select(); setStatus('Выделите текст в поле и скопируйте'); }
  };
  importB.onclick=()=>{
    try{
      const o=JSON.parse(backup.value.trim()); let n=0;
      for(const k in o){ if(k.startsWith('moneyplan:')){ localStorage.setItem(k,JSON.stringify(o[k])); n++; } }
      if(!n) throw 0;
      setStatus('Восстановлено месяцев: '+n); backup.value=''; load();
    }catch(e){ setStatus('Не получилось: проверьте, что вставлен текст копии целиком'); }
  };
}

function render(){
  const [y,m] = ym.split('-').map(Number);
  document.getElementById('title').textContent = new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(' г.','');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  tab==='plan' ? renderPlan() : renderEdit();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
prev.onclick=()=>{ ym=shiftYm(ym,-1); load(); };
next.onclick=()=>{ ym=shiftYm(ym,1); load(); };
load();
</script>
</body>
</html>
